spring.application.name=meetspace
server.port=8080
server.servlet.session.timeout=30d
spring.web.resources.cache.cachecontrol.no-store=true

# Persistent local H2 database. Data remains in MEETSPACE/data after restart.
spring.datasource.url=jdbc:h2:file:./data/meetspace;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
