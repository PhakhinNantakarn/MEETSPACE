# MEETSPACE — Continuous Deployment (same pattern as the class lab)
# git push -> Cloud Build: (1) docker build  (2) docker push to Artifact Registry  (3) deploy to Cloud Run

substitutions:
  _PROJECT_ID: meetspace-514704
  _REGION: us-central1
  _REPOSITORY: webdev-dockers
  _SERVICE: meetspace

steps:
  # 1) Build the Docker image
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest", "."]

  # 2) Push the image to Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest"]

  # 3) Deploy to Cloud Run and make it public
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --memory=1Gi
      - --max-instances=1
      - --allow-unauthenticated
      - --set-env-vars=SPRING_H2_CONSOLE_ENABLED=false

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
