steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/${_PROJECT_ID}/webdev-dockers/meetspace:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/${_PROJECT_ID}/webdev-dockers/meetspace:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'meetspace'
      - '--image'
      - 'us-central1-docker.pkg.dev/${_PROJECT_ID}/webdev-dockers/meetspace:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--max-instances'
      - '1'
images:
  - 'us-central1-docker.pkg.dev/${_PROJECT_ID}/webdev-dockers/meetspace:$COMMIT_SHA'

substitutions:
  _PROJECT_ID: 'meetspace-514517'  